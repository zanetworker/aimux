name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build web frontend
        run: |
          npm i -g pnpm && cd web && pnpm install --frozen-lockfile && pnpm build
          rm -rf ../internal/frontend/web/dist
          mkdir -p ../internal/frontend/web/dist
          cp -r dist/* ../internal/frontend/web/dist/
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -timeout 30s

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build web frontend
        run: |
          npm i -g pnpm && cd web && pnpm install --frozen-lockfile && pnpm build
          rm -rf ../internal/frontend/web/dist
          mkdir -p ../internal/frontend/web/dist
          cp -r dist/* ../internal/frontend/web/dist/
      - name: Load release notes
        id: notes
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            echo "RELEASE_HEADER<<EOFNOTES" >> $GITHUB_ENV
            cat RELEASE_NOTES.md >> $GITHUB_ENV
            echo "EOFNOTES" >> $GITHUB_ENV
          else
            echo "RELEASE_HEADER=## aimux ${{ github.ref_name }}" >> $GITHUB_ENV
          fi
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_HEADER: ${{ env.RELEASE_HEADER }}
