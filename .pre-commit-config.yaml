repos:
  # Secrets scanning — catches API keys, passwords, tokens before they're committed
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      - id: gitleaks

  # General hygiene — trailing whitespace, merge conflicts, large files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']  # block files > 1MB (catches accidental binary commits)
      - id: check-yaml
        args: ['--allow-multiple-documents']  # Kubernetes YAML uses multi-doc

  # Go linting — uses locally installed golangci-lint
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --timeout=5m --new-from-rev=HEAD
        language: system
        types: [go]
        pass_filenames: false

      # Layer discipline: core packages must not import frontend libraries.
      # A bubbletea/lipgloss import in controller/ or any non-tui package is always wrong.
      - id: layer-discipline
        name: layer-discipline
        language: script
        entry: scripts/check-layer-discipline.sh
        pass_filenames: false
        types: [go]

      # Frontend parity hint: warn when only one frontend (TUI or web) changes.
      # Advisory only — exits 0 always. Add "# parity: N/A" to commit to suppress.
      - id: frontend-parity-hint
        name: frontend-parity-hint
        language: script
        entry: scripts/check-frontend-parity.sh
        pass_filenames: false
        types: [go]
