<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" font-family="RedHatDisplay, 'Red Hat Display', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <style>
    :root {
      --bg: #1a1a1a; --bg-card: #2d2d2d; --bg-item: #3a3a3a; --bg-block: #242424;
      --accent: #ee0000; --accent-dark: #a30000;
      --text-primary: #e0e0e0; --text-secondary: #a3a3a3; --text-muted: #8a8a8a;
      --border-card: #404040; --col-divider: #333333;
      --flow-stroke: #a30000; --flow-dot: #ee0000; --conn-opacity: 0.6;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f5f5; --bg-card: #ffffff; --bg-item: #f0f0f0; --bg-block: #fafafa;
        --accent: #cc0000; --accent-dark: #a30000;
        --text-primary: #151515; --text-secondary: #4d4d4d; --text-muted: #6b6b6b;
        --border-card: #d2d2d2; --col-divider: #d2d2d2;
        --flow-stroke: #a30000; --flow-dot: #cc0000; --conn-opacity: 0.7;
      }
    }
    .t { fill: var(--text-primary); font-size: 13px; font-weight: 600; }
    .i { fill: var(--text-secondary); font-size: 10.5px; }
    .m { fill: var(--text-muted); font-size: 10px; font-weight: 700; letter-spacing: 1.5px; }
    .lbl { font-size: 10px; font-weight: 600; }
    .card { fill: var(--bg-card); stroke: var(--border-card); stroke-width: 1.5; }
    .key { fill: var(--bg-card); stroke: var(--accent); stroke-width: 2; }
    .conn { fill: none; stroke-width: 2.5; stroke-dasharray: 4 3; opacity: var(--conn-opacity); }
  </style>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dy="2" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="a-teal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#37a3a3"/></marker>
    <marker id="a-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#ee0000"/></marker>
    <marker id="a-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#7b61d6"/></marker>
    <marker id="a-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#f5921b"/></marker>
  </defs>

  <rect width="1400" height="720" fill="var(--bg)"/>
  <text x="30" y="34" class="t" font-size="17">Proposed: aimux mcp proxy grows into the one tool gateway</text>
  <text x="30" y="54" class="i">One daemon, two listeners. Trust level decides what each listener mounts; the session token narrows it further.</text>

  <!-- Column labels -->
  <text x="125" y="78" text-anchor="middle" class="m">CLIENTS</text>
  <text x="355" y="78" text-anchor="middle" class="m">AIMUX CORE</text>
  <text x="585" y="78" text-anchor="middle" class="m">LISTENERS</text>
  <text x="815" y="78" text-anchor="middle" class="m">POLICY · toolgateway</text>
  <text x="1045" y="78" text-anchor="middle" class="m">ENGINE · mcpproxy</text>
  <text x="1275" y="78" text-anchor="middle" class="m">BACKENDS</text>

  <!-- One-process boundary around listeners, policy, engine -->
  <rect x="478" y="88" width="668" height="518" rx="10" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.7"/>
  <rect x="490" y="80" width="236" height="16" fill="var(--bg)"/>
  <text x="496" y="92" class="lbl" fill="var(--accent)">aimux mcp proxy · one daemon</text>

  <!-- Lane labels -->
  <text x="30" y="106" class="lbl" fill="#37a3a3">LOCAL LANE · trusted</text>
  <text x="30" y="270" class="lbl" fill="#ee0000">SANDBOX LANE · untrusted callers</text>

  <!-- ===== Column 1: clients ===== -->
  <g filter="url(#shadow)"><rect x="30" y="115" width="190" height="100" rx="6" class="card"/></g>
  <text x="125" y="140" text-anchor="middle" class="t">Claude Code sessions</text>
  <text x="44" y="164" class="i">your terminals, on your Mac</text>
  <text x="44" y="180" class="i">MCP over loopback</text>
  <text x="44" y="196" class="i">no sandbox, no token</text>

  <g filter="url(#shadow)"><rect x="30" y="290" width="190" height="56" rx="6" class="card"/></g>
  <text x="125" y="313" text-anchor="middle" class="t">Wingman panel</text>
  <text x="125" y="331" text-anchor="middle" class="i">Workspace, Auto questions</text>

  <g filter="url(#shadow)"><rect x="30" y="362" width="190" height="56" rx="6" class="card" stroke-dasharray="5 4"/></g>
  <text x="125" y="385" text-anchor="middle" class="t">Phone app, CLI</text>
  <text x="125" y="403" text-anchor="middle" class="i">planned, same API</text>

  <!-- ===== Column 2: aimux core ===== -->
  <g filter="url(#shadow)"><rect x="260" y="280" width="190" height="140" rx="6" class="card"/></g>
  <text x="355" y="304" text-anchor="middle" class="t">Remote API v1</text>
  <text x="274" y="328" class="i">client scope from clients.yaml</text>
  <text x="274" y="345" class="i">profile → session</text>
  <text x="274" y="362" class="i">compiles the sandbox policy</text>
  <text x="274" y="379" class="i">issues a session token</text>
  <text x="274" y="396" class="i">routes Auto, runs plans</text>

  <g filter="url(#shadow)"><rect x="260" y="445" width="190" height="110" rx="6" class="card"/></g>
  <text x="355" y="469" text-anchor="middle" class="t">OpenShell sandboxes</text>
  <text x="274" y="493" class="i">Workspace (work-readonly)</text>
  <text x="274" y="510" class="i">research-with-work (planned)</text>
  <text x="274" y="527" class="i">network: only :7390 + model</text>
  <text x="274" y="544" class="i">carries its session token</text>

  <!-- ===== Column 3: listeners ===== -->
  <g filter="url(#shadow)"><rect x="490" y="115" width="190" height="100" rx="6" class="card"/></g>
  <text x="585" y="140" text-anchor="middle" class="t">Local listener</text>
  <text x="504" y="164" class="i">127.0.0.1, loopback only</text>
  <text x="504" y="180" class="i">mounts every server in</text>
  <text x="504" y="196" class="i">~/.claude.json (as today)</text>

  <g filter="url(#shadow)"><rect x="490" y="445" width="190" height="110" rx="6" class="key"/></g>
  <text x="585" y="469" text-anchor="middle" class="t">Sandbox listener</text>
  <text x="504" y="493" class="i">host.containers.internal:7390</text>
  <text x="504" y="510" class="i">mounts only servers some</text>
  <text x="504" y="527" class="i">sandbox profile allows</text>
  <text x="504" y="544" class="i">no write-capable servers</text>

  <!-- ===== Column 4: policy ===== -->
  <g filter="url(#shadow)"><rect x="720" y="115" width="190" height="100" rx="6" class="card"/></g>
  <text x="815" y="140" text-anchor="middle" class="t">Local policy</text>
  <text x="734" y="164" class="i">approvals: opt-in per client</text>
  <text x="734" y="180" class="i">off by default, so nothing</text>
  <text x="734" y="196" class="i">changes for your sessions</text>

  <g filter="url(#shadow)"><rect x="720" y="430" width="190" height="140" rx="6" class="key"/></g>
  <text x="815" y="454" text-anchor="middle" class="t">Sandbox policy</text>
  <text x="734" y="478" class="i">1  token → this session's tools</text>
  <text x="734" y="496" class="i">2  list only approved pins</text>
  <text x="734" y="514" class="i">3  re-check pin on every call</text>
  <text x="734" y="532" class="i">4  same snapshot as compiler</text>
  <text x="734" y="550" class="i">5  fail closed on change</text>

  <!-- ===== Column 5: engine ===== -->
  <g filter="url(#shadow)"><rect x="950" y="115" width="190" height="455" rx="6" class="card"/></g>
  <text x="1045" y="140" text-anchor="middle" class="t">Proxy engine</text>
  <text x="964" y="164" class="i">no policy, only plumbing:</text>
  <text x="964" y="190" class="i">• stdio servers: lazy start,</text>
  <text x="975" y="205" class="i">one shared process</text>
  <text x="964" y="228" class="i">• HTTP MCP backends</text>
  <text x="964" y="251" class="i">• OpenAPI GET → tools</text>
  <text x="964" y="274" class="i">• CLI packs (gh) → runs</text>
  <text x="975" y="289" class="i">in aimux-tools sandbox</text>
  <text x="964" y="312" class="i">• tools/list cache,</text>
  <text x="975" y="327" class="i">list_changed events</text>
  <text x="964" y="350" class="i">• status: servers, last call,</text>
  <text x="975" y="365" class="i">last error</text>

  <!-- ===== Column 6: backends ===== -->
  <g filter="url(#shadow)"><rect x="1180" y="115" width="190" height="100" rx="6" class="card"/></g>
  <text x="1275" y="140" text-anchor="middle" class="t">Your MCP servers</text>
  <text x="1194" y="164" class="i">everything in ~/.claude.json</text>
  <text x="1194" y="180" class="i">includes write-capable ones</text>
  <text x="1194" y="196" class="i">reachable from local only</text>

  <g filter="url(#shadow)"><rect x="1180" y="420" width="190" height="160" rx="6" class="card"/></g>
  <text x="1275" y="444" text-anchor="middle" class="t">Read-only sources</text>
  <text x="1194" y="468" class="i">wiki, Jira, Slack, Google</text>
  <text x="1194" y="485" class="i">(MCP, read tools only)</text>
  <text x="1194" y="508" class="i">OpenAPI GET operations</text>
  <text x="1194" y="531" class="i">gh in aimux-tools sandbox</text>
  <text x="1194" y="548" class="i">(GitHub token injected</text>
  <text x="1194" y="565" class="i">by OpenShell, read-only)</text>

  <!-- ===== Connections ===== -->
  <!-- Local lane (teal) -->
  <path id="p-l1" d="M220,165 L488,165" class="conn" stroke="#37a3a3" marker-end="url(#a-teal)"/>
  <path id="p-l2" d="M680,165 L718,165" class="conn" stroke="#37a3a3" marker-end="url(#a-teal)"/>
  <path id="p-l3" d="M910,165 L948,165" class="conn" stroke="#37a3a3" marker-end="url(#a-teal)"/>
  <path id="p-l4" d="M1140,165 L1178,165" class="conn" stroke="#37a3a3" marker-end="url(#a-teal)"/>

  <!-- Client asks (purple) -->
  <path id="p-c1" d="M220,318 L258,318" class="conn" stroke="#7b61d6" marker-end="url(#a-purple)"/>
  <path id="p-c2" d="M220,390 L258,390" class="conn" stroke="#7b61d6" marker-end="url(#a-purple)"/>
  <path id="p-c3" d="M355,420 L355,443" class="conn" stroke="#7b61d6" marker-end="url(#a-purple)"/>
  <rect x="300" y="424" width="44" height="14" fill="var(--bg)" opacity="0.85"/>
  <text x="322" y="435" text-anchor="middle" class="lbl" fill="#7b61d6">starts</text>

  <!-- Token issue (orange, control) -->
  <path id="p-k" d="M450,350 L815,350 L815,428" class="conn" stroke="#f5921b" marker-end="url(#a-orange)"/>
  <rect x="540" y="333" width="196" height="14" fill="var(--bg)" opacity="0.85"/>
  <text x="638" y="344" text-anchor="middle" class="lbl" fill="#f5921b">registers session token + tools</text>

  <!-- Sandbox lane (red) -->
  <path id="p-s1" d="M450,500 L488,500" class="conn" stroke="#ee0000" marker-end="url(#a-red)"/>
  <path id="p-s2" d="M680,500 L718,500" class="conn" stroke="#ee0000" marker-end="url(#a-red)"/>
  <path id="p-s3" d="M910,500 L948,500" class="conn" stroke="#ee0000" marker-end="url(#a-red)"/>
  <path id="p-s4" d="M1140,500 L1178,500" class="conn" stroke="#ee0000" marker-end="url(#a-red)"/>

  <!-- Blocked: sandbox lane never mounts your write-capable servers -->
  <path d="M1163,480 L1163,240" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="2 4"/>
  <line x1="1153" y1="250" x2="1173" y2="230" stroke="#ee0000" stroke-width="2.5"/>
  <line x1="1153" y1="230" x2="1173" y2="250" stroke="#ee0000" stroke-width="2.5"/>

  <!-- Dots: local -->
  <circle r="4" fill="#37a3a3" opacity="0.9"><animateMotion dur="1.6s" repeatCount="indefinite" begin="0s"><mpath href="#p-l1"/></animateMotion></circle>
  <circle r="4" fill="#37a3a3" opacity="0.9"><animateMotion dur="0.6s" repeatCount="indefinite" begin="0.2s"><mpath href="#p-l2"/></animateMotion></circle>
  <circle r="4" fill="#37a3a3" opacity="0.9"><animateMotion dur="0.6s" repeatCount="indefinite" begin="0.4s"><mpath href="#p-l3"/></animateMotion></circle>
  <circle r="4" fill="#37a3a3" opacity="0.9"><animateMotion dur="0.6s" repeatCount="indefinite" begin="0.6s"><mpath href="#p-l4"/></animateMotion></circle>
  <!-- Dots: clients -->
  <circle r="4" fill="#7b61d6" opacity="0.9"><animateMotion dur="0.8s" repeatCount="indefinite" begin="0.1s"><mpath href="#p-c1"/></animateMotion></circle>
  <circle r="4" fill="#7b61d6" opacity="0.6"><animateMotion dur="2.5s" repeatCount="indefinite" begin="0.5s"><mpath href="#p-c2"/></animateMotion></circle>
  <circle r="4" fill="#7b61d6" opacity="0.9"><animateMotion dur="0.8s" repeatCount="indefinite" begin="0.9s"><mpath href="#p-c3"/></animateMotion></circle>
  <!-- Dots: token -->
  <circle r="4" fill="#f5921b" opacity="0.7"><animateMotion dur="2.5s" repeatCount="indefinite" begin="0.3s"><mpath href="#p-k"/></animateMotion></circle>
  <!-- Dots: sandbox -->
  <circle r="4" fill="#ee0000" opacity="0.9"><animateMotion dur="0.6s" repeatCount="indefinite" begin="0s"><mpath href="#p-s1"/></animateMotion></circle>
  <circle r="4" fill="#ee0000" opacity="0.9"><animateMotion dur="0.6s" repeatCount="indefinite" begin="0.3s"><mpath href="#p-s2"/></animateMotion></circle>
  <circle r="4" fill="#ee0000" opacity="0.9"><animateMotion dur="0.6s" repeatCount="indefinite" begin="0.6s"><mpath href="#p-s3"/></animateMotion></circle>
  <circle r="4" fill="#ee0000" opacity="0.9"><animateMotion dur="0.6s" repeatCount="indefinite" begin="0.9s"><mpath href="#p-s4"/></animateMotion></circle>

  <!-- Legend -->
  <g transform="translate(170, 628)">
    <rect x="0" y="0" width="1060" height="30" rx="6" fill="var(--bg-card)" stroke="var(--border-card)"/>
    <circle cx="20" cy="15" r="5" fill="#37a3a3"/><text x="32" y="19" class="i">Local tool call (trusted)</text>
    <circle cx="230" cy="15" r="5" fill="#7b61d6"/><text x="242" y="19" class="i">Client question (remote API v1)</text>
    <circle cx="470" cy="15" r="5" fill="#f5921b"/><text x="482" y="19" class="i">Control: session token</text>
    <circle cx="660" cy="15" r="5" fill="#ee0000"/><text x="672" y="19" class="i">Sandbox tool call (untrusted)</text>
    <line x1="868" y1="9" x2="880" y2="21" stroke="#ee0000" stroke-width="2.5"/><line x1="868" y1="21" x2="880" y2="9" stroke="#ee0000" stroke-width="2.5"/>
    <text x="888" y="19" class="i">Not mounted on that listener</text>
  </g>
  <text x="700" y="690" text-anchor="middle" class="i" font-style="italic">Two walls on the sandbox lane: what is not mounted cannot be reached, and the token narrows what is mounted to one session's tools.</text>
</svg>
