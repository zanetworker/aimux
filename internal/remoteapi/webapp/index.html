<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>aimux</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header>
    <button id="back" class="icon" type="button" hidden aria-label="Back to sessions">&#8249;</button>
    <h1 id="title">aimux</h1>
    <span id="state" class="badge" hidden></span>
    <span id="status" role="status"></span>
    <button id="refresh" class="icon" type="button" aria-label="Refresh">&#8635;</button>
  </header>
  <main id="list"></main>
  <section id="session" hidden>
    <div id="banner" hidden></div>
    <div id="messages" aria-live="polite"></div>
    <form id="composer">
      <textarea id="prompt" rows="1" placeholder="Message this session" aria-label="Message"></textarea>
      <button id="send" type="submit" aria-label="Send">&#8593;</button>
      <button id="stop" type="button" hidden aria-label="Stop the turn">&#9632;</button>
    </form>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
