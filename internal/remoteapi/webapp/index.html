<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="aimux">
<title>aimux</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header>
    <button id="back" class="icon" type="button" hidden aria-label="Back to sessions">&#8249;</button>
    <div id="heading">
      <h1 id="title">aimux</h1>
      <div id="activity" hidden></div>
    </div>
    <span id="state" class="dot" hidden></span>
    <span id="status" role="status"></span>
    <button id="voice" class="icon" type="button" hidden aria-label="Voice settings" aria-haspopup="true">&#127897;</button>
    <button id="refresh" class="icon" type="button" aria-label="Refresh">&#8635;</button>
  </header>
  <div id="voicemenu" class="menu" hidden>
    <label><input type="checkbox" data-voice="speak"> Read replies aloud</label>
    <label><input type="checkbox" data-voice="autoSend"> Send when I stop talking</label>
    <label><input type="checkbox" data-voice="handsFree"> Hands-free conversation</label>
    <p class="hint">Approvals are always a tap; they are read out, never answered by voice.</p>
  </div>

  <section id="listview">
    <div id="searchbar">
      <input id="search" type="search" placeholder="Search sessions" aria-label="Search sessions" autocomplete="off" enterkeyhint="search">
      <div class="legend" aria-hidden="true"><span class="dot idle"></span>idle <span class="dot busy"></span>running <span class="dot open_in_terminal"></span>open on your Mac</div>
    </div>
    <main id="list"></main>
    <button id="newbtn" type="button" aria-label="New session">+</button>
  </section>

  <section id="newsheet" hidden>
    <p class="sheet-hint">Start Claude in one of your recent project folders.</p>
    <div id="projects" role="radiogroup" aria-label="Project"></div>
    <form id="newform">
      <textarea id="newprompt" rows="3" placeholder="What should it do?" aria-label="First message"></textarea>
      <div class="row">
        <button id="newmic" class="mic" type="button" hidden aria-label="Dictate">&#127897;</button>
        <button id="newstart" type="submit">Start</button>
      </div>
      <div id="newerror" class="error" hidden></div>
    </form>
  </section>

  <section id="session" hidden>
    <div id="banner" hidden></div>
    <div id="messages" aria-live="polite"></div>
    <button id="jump" type="button" hidden aria-label="Jump to latest">&#8595; latest</button>
    <div id="pending"></div>
    <form id="composer">
      <button id="mic" class="mic" type="button" hidden aria-label="Dictate">&#127897;</button>
      <textarea id="prompt" rows="1" placeholder="Message this session" aria-label="Message"></textarea>
      <button id="send" type="submit" aria-label="Send">&#8593;</button>
      <button id="stop" type="button" hidden aria-label="Stop the turn">&#9632;</button>
    </form>
  </section>
</div>
<script src="voice.js"></script>
<script src="app.js"></script>
</body>
</html>
